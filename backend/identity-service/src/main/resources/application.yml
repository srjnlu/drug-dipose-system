server:
  port: 8081
spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:mysql://localhost:3306/goodcycle?createDatabaseIfNotExist=true}
    username: ${IDENTITY_DB_USER:goodcycle}
    password: ${IDENTITY_DB_PASSWORD:goodcycle-local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    secret: ${JWT_SECRET:local-only-goodcycle-jwt-secret-change-before-deploy-000001}
    lifetime-minutes: ${JWT_LIFETIME_MINUTES:30}
otp:
  expose-code: ${OTP_EXPOSE_CODE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
